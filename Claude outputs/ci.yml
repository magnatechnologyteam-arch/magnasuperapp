name: CI

# Jaring pengaman sebelum deploy: setiap push/PR ke `main` dicek dulu di sini
# (build Next.js penuh, termasuk pengecekan tipe TypeScript) SEBELUM Vercel
# benar-benar men-deploy-nya ke pengguna. Sebelum file ini ada, satu-satunya
# cara tahu ada yang rusak adalah menunggu Vercel selesai deploy lalu
# mengecek manual ke aplikasi yang sudah tayang — sekarang GitHub akan
# menandai commit dengan ✔️/❌ dalam beberapa menit, sebelum sempat tayang.
#
# Tidak perlu setel Secret apa pun di GitHub — nilai di bawah cuma untuk
# supaya proses build berhasil (Next.js butuh sesuatu untuk dibaca), BUKAN
# kredensial sungguhan. Kredensial asli hanya pernah dipakai di Vercel
# (Project Settings -> Environment Variables), tidak pernah di sini.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (termasuk cek tipe TypeScript)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key-untuk-ci-bukan-kredensial-asli"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key-untuk-ci"
          PRODUCTS_API_KEY: "placeholder-products-api-key-untuk-ci"
          CRON_SECRET: "placeholder-cron-secret-untuk-ci"
